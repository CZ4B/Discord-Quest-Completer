name: Windows build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DQC_RELEASE_VERSION: ${{ github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc

      - name: Resolve application version
        id: version
        run: |
          $version = $env:DQC_RELEASE_VERSION -replace '^[vV]', ''
          if (-not $version) { throw 'Could not determine the application version' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Run tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Verify embedded version and assets
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/DiscordQuestCompleter.exe').Path
          $diagnosis = & $exe --diagnose | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $diagnosis
          if (-not $diagnosis.StartsWith("DISCORD QUEST COMPLETER ${env:EXPECTED_VERSION}:")) {
            throw 'The application version does not match the release tag'
          }
          $info = (Get-Item -LiteralPath $exe).VersionInfo
          if ($info.ProductVersion -ne $env:EXPECTED_VERSION -or $info.FileVersion -ne $env:EXPECTED_VERSION) {
            throw 'Windows executable version does not match the release tag'
          }

      - name: Package executable and checksums
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $packageName = "DiscordQuestCompleter-$env:APP_VERSION-windows-x64"
          $packageDir = Join-Path 'target/package' $packageName
          New-Item -ItemType Directory -Force -Path $packageDir, 'dist' | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/DiscordQuestCompleter.exe' $packageDir
          Copy-Item 'LICENSE' $packageDir
          Copy-Item (Join-Path $packageDir 'DiscordQuestCompleter.exe') 'dist/DiscordQuestCompleter.exe'
          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/$packageName.zip" -Force
          Get-Item -LiteralPath 'dist/DiscordQuestCompleter.exe', "dist/$packageName.zip" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content 'dist/SHA256SUMS.txt' -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DiscordQuestCompleter-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: DiscordQuestCompleter-*-windows-x64
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GH_REPO" \
            --draft \
            --generate-notes \
            --title "$RELEASE_TAG"
